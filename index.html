<style id="css">/* Painel de TV: pista de corrida em asfalto, uma só aparência (escura) para leitura à distância.
   Layout: cabeçalho fino · pista (raias por pessoa, linha de chegada = meta individual) · coluna do pódio */
:root {
  --chao: #0f1216;
  --asfalto: #181d23;
  --asfalto-2: #1d232a;
  --borda: #2b323b;
  --tinta: #ece6d8;
  --texto: #f3efe6;
  --suave: #9aa3ad;
  --amarelo: #f2c335;
  --zebra: #d9483b;
  --ok: #57c48a;
  --f-display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --f-corpo: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html { height: 100%; font-size: clamp(12px, 0.82vw + 4px, 22px); }
body {
  height: 100%; margin: 0; background: var(--chao); color: var(--texto);
  font-family: var(--f-corpo); font-size: 1rem; line-height: 1.35;
}
#app {
  min-height: 100%; display: flex; flex-direction: column; gap: 0.9rem;
  padding-block: 0.9rem; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 2px; }

/* ---------- cabeçalho ---------- */
.topo { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
.bandeira { width: 2.2rem; height: 2.2rem; flex: none; border-radius: 4px;
  background: repeating-conic-gradient(var(--tinta) 0 25%, #111 0 50%) 0 0 / 0.55rem 0.55rem; }
.marca h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 2.1rem; letter-spacing: 0.02em;
  text-transform: uppercase; line-height: 1; text-wrap: balance; }
.marca small { display: block; color: var(--suave); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.2rem; }
.indicadores { display: flex; gap: 0.6rem; margin-left: auto; flex-wrap: wrap; }
.ind { background: var(--asfalto); border: 1px solid var(--borda); border-radius: 6px; padding: 0.35rem 0.75rem; }
.ind b { font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; display: block; line-height: 1.05; }
.ind span { font-size: 0.72rem; color: var(--suave); text-transform: uppercase; letter-spacing: 0.08em; }
.acoes { display: flex; gap: 0.5rem; }
.btn { background: var(--asfalto-2); border: 1px solid var(--borda); border-radius: 6px; padding: 0.45rem 0.8rem; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--suave); }
.btn.forte { background: var(--amarelo); color: #1a1405; border-color: var(--amarelo); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---------- corpo ---------- */
.corpo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; flex: 1; min-height: 0; }
@media (min-width: 1100px) { .corpo { grid-template-columns: minmax(0, 1fr) minmax(17rem, 22rem); } }

.pista { background: var(--asfalto); border: 1px solid var(--borda); border-radius: 10px; padding: 0.8rem 0.9rem 0.7rem;
  display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }
.regua { display: grid; grid-template-columns: var(--rotulo) minmax(0, 1fr); font-size: 0.72rem; color: var(--suave);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.35rem; }
.regua .escala { position: relative; height: 1.1rem; }
.regua .escala span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.raias { --rotulo: 9.5rem; display: grid; grid-template-columns: var(--rotulo) minmax(0, 1fr); flex: 1; min-height: 0;
  grid-auto-rows: minmax(2.3rem, 1fr); position: relative; }
.pista { --rotulo: 9.5rem; }
@media (max-width: 560px) { .pista, .raias { --rotulo: 6.6rem; } }

.rotulo { display: flex; align-items: center; gap: 0.5rem; padding-right: 0.5rem; min-width: 0; border-bottom: 1px solid var(--borda); }
.rotulo .nome { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rotulo .chegou { font-size: 0.68rem; font-weight: 700; color: #111; background: var(--amarelo); border-radius: 3px; padding: 0.05rem 0.3rem; margin-left: 0.2rem; }
.avatar { width: 1.9rem; height: 1.9rem; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  font-weight: 800; font-size: 0.75rem; color: #111; border: 2px solid var(--tinta); box-sizing: border-box; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.raia { position: relative; overflow: hidden; border-bottom: 1px dashed rgba(236, 230, 216, 0.22); min-width: 0; }
.raia.par, .rotulo.par { background: var(--asfalto-2); }
.rastro { position: absolute; left: 0; top: 50%; height: 0.38rem; transform: translateY(-50%); border-radius: 0 3px 3px 0; }
.rastro.real { opacity: 0.95; }
.rastro.agendado { opacity: 0.35; background-image: repeating-linear-gradient(90deg, currentColor 0 6px, transparent 6px 10px) !important; background-color: transparent !important; }
.carro { position: absolute; top: 50%; left: 4.7rem; z-index: 2; width: 4.6rem; height: 2.1rem; transform: translate(-100%, -55%);
  transition: left 1.8s cubic-bezier(.2, .7, .2, 1); }
.carro svg { width: 100%; height: 100%; overflow: visible; display: block; }
.carro .roda { transform-box: fill-box; transform-origin: center; }
.carro .roda { animation: gira var(--vel, .35s) linear infinite; }
.carro .corpo { animation: sacode .42s ease-in-out infinite alternate; }
@keyframes sacode { from { transform: translateY(0); } to { transform: translateY(-0.6px); } }
@keyframes gira { to { transform: rotate(360deg); } }
.etiqueta { position: absolute; z-index: 2; top: 50%; transform: translate(0.35rem, -50%); font-family: var(--f-display); font-weight: 800;
  font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--tinta); white-space: nowrap; transition: left 1.8s cubic-bezier(.2, .7, .2, 1); }

.sobre { grid-column: 2; position: relative; pointer-events: none; z-index: 1; }
.chegada { position: absolute; top: 0; bottom: 0; right: 0.4rem; width: 0.7rem;
  background: repeating-conic-gradient(var(--tinta) 0 25%, #0d0d0d 0 50%) 0 0 / 0.7rem 0.7rem; opacity: 0.9; }
.ritmo { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--amarelo); opacity: 0.75; }
.largada { position: absolute; top: 0; bottom: 0; left: 0; width: 0.35rem;
  background: repeating-linear-gradient(180deg, var(--zebra) 0 0.6rem, var(--tinta) 0.6rem 1.2rem); }

.legenda { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--suave); margin-top: 0.55rem; }
.legenda i { display: inline-block; vertical-align: middle; margin-right: 0.35rem; }
.legenda .l-real { width: 1.4rem; height: 0.38rem; background: var(--tinta); border-radius: 2px; }
.legenda .l-ag { width: 1.4rem; height: 0.38rem; background: repeating-linear-gradient(90deg, var(--tinta) 0 6px, transparent 6px 10px); opacity: 0.5; }
.legenda .l-ritmo { width: 0; height: 0.9rem; border-left: 2px dashed var(--amarelo); }
.legenda .l-chegada { width: 0.6rem; height: 0.9rem; background: repeating-conic-gradient(var(--tinta) 0 25%, #0d0d0d 0 50%) 0 0 / 0.3rem 0.3rem; }

/* ---------- lateral ---------- */
.lateral { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.bloco { background: var(--asfalto); border: 1px solid var(--borda); border-radius: 10px; padding: 0.9rem 1rem; }
.bloco h2 { margin: 0 0 0.7rem; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
.podio { display: flex; flex-direction: column; gap: 0.55rem; }
.lugar { display: grid; grid-template-columns: 2.2rem 2.8rem minmax(0, 1fr) auto; align-items: center; gap: 0.6rem;
  padding: 0.45rem 0.55rem; border-radius: 8px; background: var(--asfalto-2); }
.lugar.p1 { background: linear-gradient(90deg, rgba(242, 195, 53, 0.22), var(--asfalto-2) 70%); border: 1px solid rgba(242, 195, 53, 0.55); }
.lugar .pos { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; text-align: center; color: var(--amarelo); line-height: 1; }
.lugar .avatar { width: 2.8rem; height: 2.8rem; font-size: 1rem; }
.lugar .quem { font-weight: 700; font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lugar .pts { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.lugar .pts small { display: block; font-family: var(--f-corpo); font-size: 0.65rem; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: 0.08em; }
.volta { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); gap: 0.7rem; align-items: center; }
.volta .avatar { width: 2.8rem; height: 2.8rem; font-size: 1rem; }
.volta b { font-size: 1.1rem; display: block; }
.volta span { color: var(--suave); font-size: 0.85rem; }
.vazio { color: var(--suave); font-size: 0.9rem; }
.regras { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.45rem; font-size: 0.9rem; color: #d7d2c7; }
.rodape { font-size: 0.75rem; color: var(--suave); }

/* ---------- gestão ---------- */
dialog.gestao { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--borda);
  border-radius: 12px; background: #14181d; color: var(--texto); }
dialog.gestao::backdrop { background: rgba(0, 0, 0, 0.6); }
.g-topo { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--borda); position: sticky; top: 0; background: #14181d; z-index: 1; flex-wrap: wrap; }
.g-topo h2 { margin: 0; font-family: var(--f-display); font-size: 1.5rem; text-transform: uppercase; }
.abas { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.aba { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 0.4rem 0.7rem; cursor: pointer; color: var(--suave); font-weight: 600; }
.aba[aria-selected="true"] { color: var(--texto); border-color: var(--borda); background: var(--asfalto-2); }
.g-fechar { margin-left: auto; }
.g-corpo { padding: 1rem 1.1rem 1.3rem; display: flex; flex-direction: column; gap: 1rem; font-size: 0.95rem; }
.g-corpo p { margin: 0; max-width: 70ch; }
.passos { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.35rem; }
.arquivo { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
.aviso { border-left: 3px solid var(--amarelo); background: rgba(242, 195, 53, 0.08); padding: 0.55rem 0.8rem; border-radius: 4px; }
.aviso.erro { border-color: var(--zebra); background: rgba(217, 72, 59, 0.1); }
.aviso.ok { border-color: var(--ok); background: rgba(87, 196, 138, 0.08); }
.tabela-wrap { overflow-x: auto; border: 1px solid var(--borda); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
table.t th, table.t td { padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--borda); text-align: right; white-space: nowrap; }
table.t th { color: var(--suave); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; background: #171c22; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td.esq { text-align: left; }
table.t tr.clicavel { cursor: pointer; }
table.t tr.clicavel:hover td { background: #1a2027; }
table.t input, table.t select { background: #0f1317; border: 1px solid var(--borda); border-radius: 5px; padding: 0.25rem 0.4rem; }
table.t input[type="number"] { width: 4.5rem; text-align: right; }
table.t input.largo { width: 10rem; }
table.t input.medio { width: 7rem; }
.foto-cel { display: flex; align-items: center; gap: 0.4rem; }
.foto-cel label { cursor: pointer; color: var(--amarelo); font-size: 0.8rem; text-decoration: underline; }
.foto-cel button { background: none; border: none; color: var(--suave); font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0; }
.resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.6rem; }
.resumo div { background: var(--asfalto); border: 1px solid var(--borda); border-radius: 8px; padding: 0.5rem 0.7rem; }
.resumo b { display: block; font-family: var(--f-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.resumo span { font-size: 0.75rem; color: var(--suave); }
.memoria { background: var(--asfalto); border: 1px solid var(--borda); border-radius: 8px; padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
.memoria h3 { margin: 0; font-size: 1.05rem; }
.memoria .linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; border-bottom: 1px dashed var(--borda); padding-bottom: 0.4rem; }
.memoria .linha span { color: #d7d2c7; }
.memoria .linha b { font-variant-numeric: tabular-nums; }
.memoria .linha.total b { color: var(--amarelo); }
.rodape-g { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }

body.tv .so-gestao, body.tv .acoes { display: none !important; }


.posn { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; width: 1.9rem; text-align: right; color: var(--suave); font-variant-numeric: tabular-nums; flex: none; }
.rotulo.top1 .posn, .rotulo.top2 .posn, .rotulo.top3 .posn { color: var(--amarelo); }
.rotulo.top1 .nome { color: var(--amarelo); }
.raias { --rotulo: 11.5rem; }
.pista { --rotulo: 11.5rem; }
@media (max-width: 560px) { .pista, .raias { --rotulo: 8.4rem; } .posn { width: 1.4rem; font-size: 1rem; } }
.vento { position: absolute; right: 100%; top: 18%; width: 2.2rem; height: 64%; display: flex; flex-direction: column; justify-content: space-around; pointer-events: none; }
.vento i { display: block; height: 2px; border-radius: 2px; background: rgba(236, 230, 216, .55); animation: vento .7s linear infinite; }
.vento i:nth-child(2) { animation-delay: .23s; width: 70%; margin-left: 30%; }
.vento i:nth-child(3) { animation-delay: .46s; width: 85%; margin-left: 15%; }
@keyframes vento { from { transform: translateX(60%); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(-80%); opacity: 0; } }
.etiqueta { left: 4.9rem; }
.avatar.grande { width: 6rem; height: 6rem; border-width: 4px; }

/* ---------- intervalo (clipe de 30 s) ---------- */
.intervalo { position: fixed; inset: 0; z-index: 50; background: #0b0e12; overflow: hidden; color: var(--texto); }
.iv-ceu { position: absolute; left: 0; right: 0; top: 0; height: 30%; background: linear-gradient(#151b23, #0e1217); }
.iv-arquibancada { position: absolute; left: 0; right: 0; bottom: 0; height: 45%;
  background: radial-gradient(circle at 50% 40%, rgba(236,230,216,.35) 0 2px, transparent 3px) 0 0 / 14px 12px, linear-gradient(#202833, #161c24);
  animation: rola-fundo 2.4s linear infinite; }
.iv-pista { position: absolute; left: 0; right: 0; top: 30%; height: 62%; background: #1b2027;
  border-top: 12px solid transparent; border-bottom: 12px solid transparent;
  border-image: repeating-linear-gradient(90deg, var(--zebra) 0 40px, var(--tinta) 40px 80px) 12; }
.iv-faixa { position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%);
  background: repeating-linear-gradient(90deg, var(--tinta) 0 70px, transparent 70px 140px); animation: rola .35s linear infinite; opacity: .7; }
@keyframes rola { from { background-position: 0 0; } to { background-position: -140px 0; } }
@keyframes rola-fundo { from { background-position: 0 0, 0 0; } to { background-position: -140px 0, 0 0; } }
.intervalo.curta .iv-pista { opacity: .35; }
.iv-legenda { position: absolute; top: 5%; left: 0; right: 0; text-align: center; padding: 0 16px; z-index: 3; }
.iv-legenda b { display: block; font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 5vw, 5.5rem); text-transform: uppercase; line-height: 1; text-wrap: balance; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
.iv-legenda span { display: block; margin-top: .5rem; font-size: clamp(1rem, 1.6vw, 1.8rem); color: var(--amarelo); font-weight: 700; }
.iv-pular { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; opacity: .75; }
body.tv .iv-pular { display: none; }
.iv-luzes { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; gap: 1.4rem; background: #0a0a0a; padding: 1rem 1.4rem; border-radius: 1rem; border: 3px solid #333; z-index: 4; }
.iv-luzes i { width: clamp(3rem, 6vw, 6.5rem); aspect-ratio: 1; border-radius: 50%; background: #2a2a2a; box-shadow: inset 0 0 12px #000; }
.iv-luzes i.verm { background: #e23b2e; box-shadow: 0 0 30px #e23b2e; }
.iv-luzes i.verde { background: #3fd07a; box-shadow: 0 0 34px #3fd07a; }
.iv-carro { position: absolute; width: clamp(9rem, 17vw, 20rem); aspect-ratio: 80 / 36; transform: translate(-50%, -50%); z-index: 2; }
.iv-carro svg { width: 100%; height: 100%; overflow: visible; display: block; }
.iv-carro .roda { transform-box: fill-box; transform-origin: center; animation: gira .16s linear infinite; }
.iv-carro .vento { width: 45%; }
.iv-carro .vento i { height: 4px; }
.iv-nome { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: .2rem; font-family: var(--f-display); font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.9rem); text-transform: uppercase; white-space: nowrap; text-shadow: 0 2px 0 #000; }
.iv-fogo { position: absolute; right: 96%; top: 38%; width: 40%; height: 38%; border-radius: 50% 0 0 50%;
  background: radial-gradient(ellipse at 100% 50%, #fff6c2 0 18%, #ffb52e 35%, #e2461f 62%, transparent 72%); animation: chama .09s linear infinite alternate; filter: blur(1px); }
@keyframes chama { from { transform: scaleX(.85) scaleY(.9); } to { transform: scaleX(1.15) scaleY(1.05); } }
.iv-faisca { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffd34d; box-shadow: 0 0 8px #ffb52e; z-index: 3; }
.iv-confete { position: absolute; top: 0; width: 10px; height: 16px; z-index: 4; }
.iv-obj { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
.iv-cafe { position: absolute; width: clamp(3rem, 5vw, 6rem); aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 1; filter: drop-shadow(0 0 14px rgba(242,195,53,.8)); }
.iv-cafe svg { width: 100%; height: 100%; }
.iv-rampa { position: absolute; width: clamp(5rem, 9vw, 11rem); aspect-ratio: 2 / 1; transform: translate(-50%, -20%); z-index: 1;
  background: linear-gradient(90deg, var(--amarelo), #b88f12); clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.iv-podio { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: clamp(1rem, 3vw, 3rem); z-index: 3; }
.iv-degrau { display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; }
.iv-degrau b { font-family: var(--f-display); font-size: clamp(1.4rem, 2.4vw, 2.8rem); text-transform: uppercase; }
.iv-degrau span { color: var(--amarelo); font-weight: 700; font-size: clamp(.9rem, 1.3vw, 1.5rem); }
.iv-bloco { margin-top: .4rem; width: clamp(7rem, 12vw, 14rem); background: var(--asfalto-2); border: 2px solid var(--borda); border-bottom: none; border-radius: 8px 8px 0 0;
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 4vw, 4.5rem); color: var(--amarelo); }
.iv-degrau.d1 .iv-bloco { height: clamp(7rem, 16vh, 13rem); }
.iv-degrau.d2 .iv-bloco { height: clamp(5rem, 11vh, 9rem); }
.iv-degrau.d3 .iv-bloco { height: clamp(4rem, 8vh, 7rem); }
.iv-degrau.d1 .avatar { width: 7.5rem; height: 7.5rem; border-color: var(--amarelo) !important; }
@media (prefers-reduced-motion: reduce) {
  .carro, .etiqueta { transition: none; }
  .carro .roda, .carro .corpo, .vento i, .iv-faixa, .iv-arquibancada, .iv-carro .roda, .iv-fogo { animation: none; }
}

.iv-banana { width: clamp(3.5rem, 6vw, 7rem); aspect-ratio: 3 / 2; }

<script id="calc-src">/* ===== Apuração — funções puras (mesmas regras do apuracao.py) ===== */
var Calc = (function () {
  function norm(s) {
    return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().trim();
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseDia(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDias(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }

  function modalidade(r) {
    r = norm(r);
    var map = [["USG", "USG"], ["RESSON", "RM"], ["TOMOG", "TC"], ["RX", "RX/MMG/DO"], ["CONSULTA", "CONSULTA"],
      ["CORE", "PROCED"], ["HISTERO", "PROCED"], ["ENMG", "ENMG"]];
    for (var i = 0; i < map.length; i++) if (r.indexOf(map[i][0]) >= 0) return map[i][1];
    return "OUTRO";
  }

  /* dias-equivalentes entre a e b (inclusive): útil = 1, sábado = 0,5, domingo e feriado = 0 */
  function diasEquiv(a, b, feriados) {
    var f = {}; (feriados || []).forEach(function (x) { f[x] = 1; });
    var t = 0, d = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    while (d <= b) {
      var w = d.getDay(), k = dkey(d);
      if (!f[k]) t += (w === 6 ? 0.5 : (w === 0 ? 0 : 1));
      d = addDias(d, 1);
    }
    return t;
  }
  function diasEquivLista(datas, feriados) {
    var f = {}; (feriados || []).forEach(function (x) { f[x] = 1; });
    var t = 0;
    (datas || []).forEach(function (s) {
      var d = parseDia(s), w = d.getDay();
      if (!f[s]) t += (w === 6 ? 0.5 : (w === 0 ? 0 : 1));
    });
    return t;
  }

  function toDate(v) {

    if (typeof v === "number") return new Date(Math.round((v - 25569) * 86400000) + new Date().getTimezoneOffset() * 60000);
    if (typeof v === "string" && /^\d{2}\/\d{2}\/\d{4}/.test(v)) {
      var m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
      return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    }
    if (typeof v === "string" && v) { var d = new Date(v); if (!isNaN(d)) return d; }
    return null;
  }

  var COLS = ["Isn agenda", "Data do agendamento", "Hora do agendamento", "Empresa", "Recurso", "Paciente",
    "Data de nascimento", "Status", "Motivo do cancelamento", "Usuário que cadastrou", "Data de cadastro"];

  /* rows: objetos de XLSX.utils.sheet_to_json — devolve só contagens por pessoa, nunca dados de paciente */
  function apurar(rows, cfg) {
    var faltando = COLS.filter(function (c) { return !rows.length || !(c in rows[0]); });
    if (faltando.length) throw new Error("A planilha não tem as colunas: " + faltando.join(", ") + ". Exporte o relatório de agendamentos completo do Naja.");
    var inicio = parseDia(cfg.campanha.inicio), fimDia = parseDia(cfg.campanha.fim);
    var fim = new Date(fimDia.getFullYear(), fimDia.getMonth(), fimDia.getDate(), 23, 59, 59);
    var baseAte = addDias(parseDia(cfg.campanha.baseFim), 1);

    var grupos = {}, lidas = 0, cadMax = null;
    rows.forEach(function (r) {
      if (!r["Empresa"]) return;
      lidas++;
      var dAg = toDate(r["Data do agendamento"]), cad = toDate(r["Data de cadastro"]);
      if (!dAg || !cad) return;
      var h = String(r["Hora do agendamento"] == null ? "0" : r["Hora do agendamento"]).replace(/\D/g, "");
      while (h.length < 4) h = "0" + h;
      var ex = new Date(dAg.getFullYear(), dAg.getMonth(), dAg.getDate(), +h.slice(0, 2), +h.slice(2, 4));
      var mod = modalidade(r["Recurso"]);
      var key = String(r["Isn agenda"]) + "|" + mod;
      if (!cadMax || cad > cadMax) cadMax = cad;
      var g = grupos[key];
      if (!g) grupos[key] = g = { rows: [] };
      g.rows.push({ ex: ex, cad: cad, r: r, mod: mod });
    });

    var corte = cfg.corte ? parseDia(cfg.corte) : new Date(cadMax.getFullYear(), cadMax.getMonth(), cadMax.getDate());
    var uns = [];
    Object.keys(grupos).forEach(function (k) {
      var rs = grupos[k].rows.slice().sort(function (a, b) { return a.ex - b.ex; });
      var f = rs[0], r = f.r;
      var nasc = toDate(r["Data de nascimento"]);
      uns.push({

        motivo: norm(r["Motivo do cancelamento"]), mod: f.mod, cad: f.cad, ex: f.ex, isn: String(r["Isn agenda"]),

    });

    uns = uns.filter(function (u) { return u.status !== "Pré-agendado" && u.user !== "SISTEMA"; });
    uns.forEach(function (u) {
      if (u.status === "Cancelado") u.res = u.motivo.indexOf("DESIST") >= 0 ? "cancel_pac" : "cancel_erro";

      u.dia = dkey(u.ex);

    uns.forEach(function (u) {
      u.excl = "";
      if (u.lead < cfg.campanha.leadMin) u.excl = "lead";
      if (u.res === "cancel_erro") u.excl = "erro";
    });
    var vistos = {};
    uns.filter(function (u) { return !u.excl; }).sort(function (a, b) { return a.cad - b.cad; }).forEach(function (u) {
      var k = u.pk + "|" + u.dia + "|" + u.mod;
      if (vistos[k]) u.excl = "dup"; else vistos[k] = 1;
    });
    // remarcação: o crédito volta para quem fez o agendamento original
    var canc = uns.filter(function (u) { return u.res === "cancel_pac"; })
      .map(function (u) { return { pk: u.pk, mod: u.mod, cad: u.cad, user: u.user }; });
    var trinta = 30 * 86400000, remarc = { transferidas: 0, ambiguas: 0 };
    uns.forEach(function (u) {
      if (u.excl || u.res === "cancel_pac") return;
      var c = canc.filter(function (x) {
        return x.pk === u.pk && x.mod === u.mod && x.cad < u.cad && x.cad >= u.cad - trinta && x.user !== u.user;
      }).sort(function (a, b) { return a.cad - b.cad; });
      if (c.length) {
        var donos = {}; c.forEach(function (x) { donos[x.user] = 1; });
        u.de = u.user; u.user = c[c.length - 1].user;
        u.ambigua = Object.keys(donos).length > 1;

    var linhas = {}, base = {}, casados = 0;
    var validos = uns.filter(function (u) { return !u.excl; });
    cfg.participantes.forEach(function (p) {
      var pref = norm(p.prefixo);
      var s = validos.filter(function (u) { return u.user.indexOf(pref) === 0; });
      s.forEach(function (u) { u.dono = p.nome; });
      casados += s.length;
      var c = { validos: s.length, ef: 0, fa: 0, pend: 0, canc: 0 };
      s.forEach(function (u) {
        if (u.res === "compareceu") c.ef++; else if (u.res === "falta") c.fa++;
        else if (u.res === "pendente") c.pend++; else if (u.res === "cancel_pac") c.canc++;
      });
      linhas[p.id] = c;
      base[p.id] = s.filter(function (u) { return u.cad <= baseAte; }).length;
    });
    var exc = { lead: 0, erro: 0, dup: 0 };
    uns.forEach(function (u) { if (u.excl) exc[u.excl]++; });
    var exs = uns.map(function (u) { return u.ex; });
    /* relatório de exceções: só número da agenda, modalidade, datas e usuário do Naja; nunca nome de paciente.
       Fica fora do placar publicado (o app descarta antes de publicar). */
    var MOT = { lead: "criado a menos de " + cfg.campanha.leadMin + " min do exame", erro: "cancelado por erro de marcação", dup: "duplicidade (mesmo paciente, dia e modalidade)" };
    function hora(d) { return dkey(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
    var excecoes = [];
    uns.forEach(function (u) {
      var base = { isn: u.isn, mod: u.mod, exame: hora(u.ex), cadastro: hora(u.cad) };
      if (u.excl) excecoes.push(Object.assign({ tipo: "excluído", usuario: u.user, credito: "", obs: MOT[u.excl] }, base));
      else if (u.de) excecoes.push(Object.assign({ tipo: u.ambigua ? "remarcação AMBÍGUA, revisar" : "remarcação", usuario: u.de, credito: u.dono || u.user,
        obs: u.ambigua ? "mais de uma desistência compatível nos 30 dias anteriores, de usuários diferentes" : "desistência do mesmo paciente e modalidade nos 30 dias anteriores" }, base));
      else if (!u.dono) excecoes.push(Object.assign({ tipo: "fora dos participantes", usuario: u.user, credito: "", obs: "usuário do Naja não bate com nenhum prefixo cadastrado" }, base));
    });
    return {
      corte: dkey(corte),
      ultimoCadastro: cadMax ? dkey(cadMax) : null,
      geradoEm: new Date().toISOString(),
      linhasLidas: lidas,
      agendamentos: uns.length,
      validos: validos.length,
      foraDosParticipantes: validos.length - casados,
      excluidos: exc,
      remarcacoes: remarc,
      excecoes: excecoes,
      exameDe: exs.length ? dkey(new Date(Math.min.apply(null, exs))) : null,
      exameAte: exs.length ? dkey(new Date(Math.max.apply(null, exs))) : null,
      linhas: linhas,
      base: base
    };
  }

  function multQualidade(t, faixas) {
    for (var i = 0; i < faixas.length; i++) if (t >= faixas[i][0]) return faixas[i][1];
    return faixas[faixas.length - 1][1];
  }

  /* pontos confirmados = compareceram × valor da classe × multiplicador de qualidade;
     pontos a confirmar = agendados ainda por vir × valor da classe (sem multiplicador);
     pista = confirmados + a confirmar. Na apuração final (18/12) não sobra nada a confirmar. */
  function derivar(estado) {
    var c = estado.campanha;
    var pessoas = estado.participantes.map(function (p) {
      var l = (estado.placar && estado.placar.linhas[p.id]) || { validos: 0, ef: 0, fa: 0, pend: 0, canc: 0 };
      var resolv = l.ef + l.fa;
      var taxaAj = (l.ef + c.taxaCasa * c.priorN) / (resolv + c.priorN);
      var mult = resolv >= c.minResolv ? multQualidade(taxaAj, c.faixas) : 1;
      var pts = estado.classes[p.classe];
      var ptsReal = Math.round(l.ef * pts * mult), ptsPend = Math.round(l.pend * pts);
      return {
        p: p, l: l, taxaBruta: resolv ? l.ef / resolv : null, taxaAj: taxaAj, mult: mult, emCalibracao: resolv < c.minResolv,
        pts: pts, ptsReal: ptsReal, ptsPend: ptsPend, ptsPista: ptsReal + ptsPend,
        elegivel: taxaAj >= c.corteElegivel || resolv < c.minResolv
      };
    });
    pessoas.sort(function (a, b) { return b.ptsPista - a.ptsPista || b.ptsReal - a.ptsReal || a.p.nome.localeCompare(b.p.nome, "pt-BR"); });
    pessoas.forEach(function (x, i) { x.pos = i + 1; });
    var max = pessoas.length ? Math.max(1, pessoas[0].ptsPista) : 1;
    var tot = { ef: 0, pend: 0 };
    pessoas.forEach(function (x) { tot.ef += x.l.ef; tot.pend += x.l.pend; });
    return { pessoas: pessoas, max: max, tot: tot };
  }

  /* volta mais rápida: quem mais somou pontos na pista nos últimos ~7 dias */
  function voltaRapida(estado, der) {
    var h = (estado.historico || []).slice().sort(function (a, b) { return a.data < b.data ? -1 : 1; });
    if (h.length < 2) return null;
    var ult = h[h.length - 1], dUlt = parseDia(ult.data);
    var alvo = addDias(dUlt, -7), ref = null;
    h.forEach(function (e) { if (parseDia(e.data) <= alvo) ref = e; });
    if (!ref) { ref = h[0]; if ((dUlt - parseDia(ref.data)) / 86400000 < 3) return null; }
    var melhor = null;
    der.pessoas.forEach(function (x) {
      var ganho = Math.round(((ult.u[x.p.id] || 0) - (ref.u[x.p.id] || 0)) * x.pts);
      if (!melhor || ganho > melhor.ganho) melhor = { x: x, ganho: ganho };
    });
    if (!melhor || melhor.ganho <= 0) return null;
    melhor.dias = Math.round((dUlt - parseDia(ref.data)) / 86400000);
    return melhor;
  }

  /* ===== Força-tarefa Lab =====
     Fonte: relatório de produtos faturados do Naja (uma linha por exame).
     1 coleta = 1 atendimento com pelo menos um exame não cancelado. Guarda só contagens por dia e unidade. */
  var COLS_LAB = ["Atendimento", "Data Atend", "Empresa", "Status do atendimento"];
  function unidadeLab(emp) { return norm(emp).indexOf("IGARASSU") >= 0 ? "iga" : "vsa"; }
  function apurarLab(rows, cfg) {
    var faltando = COLS_LAB.filter(function (c) { return !rows.length || !(c in rows[0]); });
    if (faltando.length) throw new Error("A planilha não tem as colunas: " + faltando.join(", ") + ". Exporte o relatório de produtos do laboratório do Naja.");
    var at = {}, lidas = 0;
    rows.forEach(function (r) {
      if (!r["Empresa"] || r["Atendimento"] == null) return;
      lidas++;
      var d = toDate(r["Data Atend"]); if (!d) return;
      var k = String(r["Atendimento"]);
      var a = at[k] || (at[k] = { dia: dkey(d), un: unidadeLab(r["Empresa"]), ex: 0, canc: 0 });
      if (String(r["Status do atendimento"] || "").trim().toUpperCase() === "C") a.canc++; else a.ex++;
    });
    var dias = {}, exames = 0, cancelados = 0, de = null, ate = null;
    Object.keys(at).forEach(function (k) {
      var a = at[k];
      if (!de || a.dia < de) de = a.dia; if (!ate || a.dia > ate) ate = a.dia;
      if (!a.ex) { cancelados++; return; }
      var d = dias[a.dia] || (dias[a.dia] = { vsa: 0, iga: 0 });
      d[a.un]++; exames += a.ex;
    });
    var tot = 0; Object.keys(dias).forEach(function (k) { tot += dias[k].vsa + dias[k].iga; });
    return { corte: cfg && cfg.corte ? cfg.corte : ate, geradoEm: new Date().toISOString(), linhasLidas: lidas,
      coletas: tot, exames: exames, canceladas: cancelados, de: de, ate: ate, dias: dias };
  }
  /* dias de coleta: segunda a sábado (domingo fechado) */
  function diasColeta(a, b) { var t = 0, d = new Date(a.getFullYear(), a.getMonth(), a.getDate()); while (d <= b) { if (d.getDay() !== 0) t++; d = addDias(d, 1); } return t; }
  function derivarLab(lab, mesKey) {
    var dias = (lab && lab.placar && lab.placar.dias) || {}, corte = lab && lab.placar ? lab.placar.corte : null;
    var mes = mesKey || (corte ? corte.slice(0, 7) : null);
    var meses = {};
    Object.keys(dias).forEach(function (k) { var m = k.slice(0, 7), x = meses[m] || (meses[m] = { vsa: 0, iga: 0 }); x.vsa += dias[k].vsa; x.iga += dias[k].iga; });
    var cur = meses[mes] || { vsa: 0, iga: 0 }, feito = cur.vsa + cur.iga, meta = (lab.metas || {})[mes] || 0;
    var p = mes.split("-"), ini = new Date(+p[0], +p[1] - 1, 1), fim = new Date(+p[0], +p[1], 0);
    var dCorte = corte ? parseDia(corte) : ini;
    var decorridos = diasColeta(ini, dCorte), restantes = Math.max(0, diasColeta(addDias(dCorte, 1), fim));
    var media = decorridos ? feito / decorridos : 0;
    var serie = [];
    for (var d = new Date(ini); d <= fim; d = addDias(d, 1)) { var k = dkey(d), x = dias[k]; serie.push({ dia: k, dom: d.getDay() === 0, n: x ? x.vsa + x.iga : null, futuro: corte ? k > corte : true }); }
    return { mes: mes, meta: meta, feito: feito, vsa: cur.vsa, iga: cur.iga, falta: Math.max(0, meta - feito), pct: meta ? feito / meta : 0,
      decorridos: decorridos, restantes: restantes, media: media, precisa: restantes ? Math.max(0, meta - feito) / restantes : null,
      projecao: Math.round(feito + media * restantes), serie: serie, meses: meses, totalDias: diasColeta(ini, fim) };
  }

  return { apurar: apurar, derivar: derivar, voltaRapida: voltaRapida, apurarLab: apurarLab, derivarLab: derivarLab,
    diasEquiv: diasEquiv, parseDia: parseDia, dkey: dkey, norm: norm };
})();
if (typeof module !== "undefined") module.exports = Calc;
</script>
<script id="app-src">/* ===== Painel — interface ===== */
(function () {
  var ESTADO = JSON.parse(document.getElementById("estado").textContent);
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* modo TV: pelo endereço (#tv) ou pelo botão, lembrado só neste navegador */
  var TV = location.hash === "#tv" || lsGet("campeao.modoTV") === "1";
  var cap = { artifact: null, podeEditar: false, user: null, downloads: null, eu: null };
  var app = document.getElementById("app");
  var REDUZ = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (TV) document.body.classList.add("tv");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function num(x, d) { return Number(x).toLocaleString("pt-BR", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function dataBR(s) { if (!s) return "—"; var p = s.split("-"); return p[2] + "/" + p[1]; }
  function dataBRano(s) { if (!s) return "—"; var p = s.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }

  function congelado() { var c = ESTADO.campanha.congelaEm; return !!c && hojeKey() >= c; }
  function iniciais(n) { var p = String(n).trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase(); }

    var hoje = new Date(); hoje = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
    return Math.max(0, Math.round((Calc.parseDia(fim) - hoje) / 86400000));
  }

  /* ---------- fotos ilustrativas (até subir as fotos reais) ---------- */
  var PELES = ["#f2c9a8", "#e0ac84", "#c98d62", "#a96d45", "#7f4b2e", "#f6d6bd"];
  var CABELOS = ["#2a1c13", "#4b2f1d", "#161616", "#6c3f26", "#a8733b", "#3a2418"];
  var MASC = { fabricio: 1, junior: 1, yury: 1 };
  var cacheDemo = {};
  function fotoDemo(p) {
    if (cacheDemo[p.id]) return cacheDemo[p.id];
    var h = 0; for (var i = 0; i < p.id.length; i++) h = (h * 31 + p.id.charCodeAt(i)) >>> 0;
    var pele = PELES[h % PELES.length], cab = CABELOS[(h >> 3) % CABELOS.length];

    if (estilo === "coque") s += '<circle cx="50" cy="15" r="11" fill="' + cab + '"/>';
    if (estilo === "cacheado") [[30, 30], [40, 22], [52, 19], [63, 23], [71, 32], [26, 44], [74, 45], [28, 58], [72, 58]].forEach(function (c) { s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="10" fill="' + cab + '"/>'; });

    s += '<rect x="43" y="66" width="14" height="12" rx="5" fill="' + pele + '"/>';

    s += estilo === "curto"
      ? '<path d="M28 47 Q28 22 50 22 Q72 22 72 47 Q66 32 50 31 Q35 32 28 47 Z" fill="' + cab + '"/>'

    s += '<circle cx="41.5" cy="51" r="2.8" fill="#1d1d1d"/><circle cx="58.5" cy="51" r="2.8" fill="#1d1d1d"/>' +
      '<circle cx="36" cy="59" r="3.5" fill="#e88" opacity=".35"/><circle cx="64" cy="59" r="3.5" fill="#e88" opacity=".35"/>' +

  }
  function foto(p) { return p.foto || fotoDemo(p); }
  var temIlustrativa = function () { return ESTADO.participantes.some(function (p) { return !p.foto; }); };

  function avatar(p, cls) {

  }

  var uid = 0;
  function carro(p) {

    return '<svg viewBox="0 0 80 36" aria-hidden="true"><g class="corpo">' +
      '<rect x="1" y="13" width="7" height="3.2" rx="1" fill="#111"/><rect x="3.5" y="15" width="2" height="6" fill="#111"/>' +
      '<path d="M5 25 L9 17 Q13 13.5 22 13.5 L46 13.5 Q52 13.5 57 18 L71 20 Q77 21 77 25.5 L77 28.5 L5 28.5 Z" fill="' + esc(p.cor) + '"/>' +
      '<path d="M46 13.5 Q52 13.5 57 18 L46 18 Z" fill="rgba(0,0,0,.28)"/>' +
      '<rect x="62" y="23" width="13" height="2" rx="1" fill="rgba(255,255,255,.55)"/>' +

      '<image href="' + esc(foto(p)) + '" x="27" y="1" width="18" height="18" preserveAspectRatio="xMidYMid slice" clip-path="url(#' + id + ')"/></g>' +
      roda(20) + roda(63) + '</svg>';
  }
  function roda(cx) {
    return '<g class="roda"><circle cx="' + cx + '" cy="28.5" r="6.3" fill="#0b0b0b"/><circle cx="' + cx + '" cy="28.5" r="2.7" fill="#8b929a"/>' +
      '<rect x="' + (cx - 0.6) + '" y="22.6" width="1.2" height="3.4" fill="#c9ced3"/><rect x="' + (cx - 0.6) + '" y="31" width="1.2" height="3.4" fill="#c9ced3"/>' +
      '<rect x="' + (cx - 5.9) + '" y="27.9" width="3.4" height="1.2" fill="#c9ced3"/><rect x="' + (cx + 2.5) + '" y="27.9" width="3.4" height="1.2" fill="#c9ced3"/></g>';
  }

  /* ---------- tela principal ---------- */

  var xlsxCarregando = null;
  function carregaXLSX() {
    if (window.XLSX) return Promise.resolve();
    if (xlsxCarregando) return xlsxCarregando;
    xlsxCarregando = new Promise(function (ok, falha) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.charset = "utf-8"; /* a biblioteca tem caracteres fora do ASCII; sem isso, espaços especiais viram lixo e a deduplicação erra */
      s.onload = ok; s.onerror = function () { xlsxCarregando = null; falha(new Error("Não consegui carregar o leitor de planilhas. Verifique a internet e tente de novo.")); };
      document.head.appendChild(s);
    });
    return xlsxCarregando;
  }
  function impressao(buf) {
    try {
      if (!(window.crypto && crypto.subtle)) return Promise.resolve("indisponível");
      return crypto.subtle.digest("SHA-256", buf).then(function (d) {
        return Array.prototype.map.call(new Uint8Array(d), function (b) { return (b < 16 ? "0" : "") + b.toString(16); }).join("").slice(0, 16);
      }).catch(function () { return "indisponível"; });
    } catch (e) { return Promise.resolve("indisponível"); }
  }
  function reapurar(corte) {
    var cfg = Object.assign({}, ESTADO, { corte: corte || null });
    previa.pl = Calc.apurar(previa.rows, cfg);
  }

  function csvExcecoes() {
    var pl = previa.pl, q = function (v) { v = String(v == null ? "" : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var L = [];
    L.push(["Relatório de exceções · Campeão de Agendamentos"].join(";"));
    L.push(["Arquivo", previa.arquivo.nome].map(q).join(";"));
    L.push(["Impressão digital (SHA-256, 16 primeiros)", previa.arquivo.hash].map(q).join(";"));
    L.push(["Exportação do Naja em", dataBRano(pl.corte)].map(q).join(";"));
    L.push(["Gerado em", quando(new Date().toISOString())].map(q).join(";"));
    L.push("");
    L.push(["Tipo", "Isn agenda", "Modalidade", "Exame", "Cadastro", "Usuário que cadastrou", "Crédito para", "Observação"].join(";"));
    pl.excecoes.slice().sort(function (a, b) { return a.tipo < b.tipo ? -1 : a.tipo > b.tipo ? 1 : (a.cadastro < b.cadastro ? -1 : 1); }).forEach(function (e) {
      L.push([e.tipo, e.isn, e.mod, e.exame, e.cadastro, e.usuario, e.credito, e.obs].map(q).join(";"));
    });
    return "﻿" + L.join("\r\n");
  }

  function ligaPlacar() {
    var bs = document.getElementById("g-site");
    if (bs) bs.onclick = function () { baixarSite(document.getElementById("g-site-status")); };

        buf = b; return impressao(b.slice(0));
      }).then(function (hash) {
        var wb = XLSX.read(buf, { cellDates: true });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null, raw: true });
        previa = { rows: rows, arquivo: { nome: f.name, hash: hash } };

  function reduzFoto(file) {
    return new Promise(function (ok, falha) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var t = 160, cv = document.createElement("canvas"); cv.width = t; cv.height = t;
        var s = Math.min(img.width, img.height), cx = cv.getContext("2d");
        cx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, t, t);
        URL.revokeObjectURL(url); ok(cv.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); falha(new Error("Não consegui abrir essa imagem.")); };
      img.src = url;
    });
  }

  function mudancasDeRegra() {
    var antes = {}; ESTADO.participantes.forEach(function (p) { antes[p.id] = p; });
    var out = [];
    rascunho.participantes.forEach(function (p) {
      var a = antes[p.id]; if (!a) return;
      Object.keys(CAMPOS_REGRA).forEach(function (k) {
        if (String(a[k]) !== String(p[k])) out.push({ id: p.id, nome: p.nome, campo: k, de: a[k], para: p[k] });
      });
    });
    return out;
  }

      h += '<div class="resumo"><div><b>' + num(pl.coletas) + '</b><span>coletas (atendimentos válidos)</span></div>' +
        '<div><b>' + num(vsa) + ' · ' + num(iga) + '</b><span>Vitória · Igarassu</span></div>' +
        '<div><b>' + num(pl.exames) + '</b><span>exames nesses atendimentos</span></div>' +
        '<div><b>' + num(pl.canceladas) + '</b><span>atendimentos cancelados (fora)</span></div>' +
        '<div><b>' + dataBR(pl.de) + '–' + dataBR(pl.ate) + '</b><span>período do arquivo</span></div></div>';
      h += '<p class="vazio">Arquivo: ' + esc(previaLab.arquivo.nome) + ' · impressão digital ' + esc(previaLab.arquivo.hash) + '</p>';
    }
    var bl = previaLab && previaLab.pl && previaLab.pl.corte > hojeKey();
    h += '<div class="rodape-g"><button class="btn forte" type="button" id="gl-publicar"' + (cap.artifact && !bl ? '' : ' disabled') + '>' +
      (previaLab && previaLab.pl ? 'Publicar placar do Lab' : 'Salvar metas') + '</button><span class="vazio" id="gl-pub-status"></span></div>';
    return h;
  }
  function ligaLab() {
    var d = document.getElementById("gestao");
    d.querySelectorAll("input[data-mes]").forEach(function (e) {
      e.onchange = function () { var v = parseInt(e.value, 10); if (v >= 0) metasRasc[e.dataset.mes] = v; };
    });
    var inp = document.getElementById("gl-arquivo"), st = document.getElementById("gl-status");
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      st.textContent = "Lendo " + f.name + "…";
      var buf;
      carregaXLSX().then(function () { return f.arrayBuffer(); }).then(function (b) { buf = b; return impressao(b.slice(0)); }).then(function (hash) {
        var wb = XLSX.read(buf, { cellDates: true });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null, raw: true });
        previaLab = { rows: rows, arquivo: { nome: f.name, hash: hash } };
        previaLab.pl = Calc.apurarLab(rows, { corte: hojeKey() });
      }).catch(function (e) { previaLab = { erro: e.message || String(e) }; }).then(renderGestao);
    };
    var dc = document.getElementById("gl-corte");
    if (dc) dc.onchange = function () { if (/^\d{4}-\d{2}-\d{2}$/.test(dc.value)) { previaLab.pl = Calc.apurarLab(previaLab.rows, { corte: dc.value }); renderGestao(); } };
    var pub = document.getElementById("gl-publicar");
    pub.onclick = function () {
      var novo = JSON.parse(JSON.stringify(ESTADO));
      novo.lab = novo.lab || { metas: {} };
      novo.lab.metas = JSON.parse(JSON.stringify(metasRasc));
      if (previaLab && previaLab.pl) {
        var pl = previaLab.pl, dias = {};
        var velhos = (novo.lab.placar && novo.lab.placar.dias) || {};
        Object.keys(velhos).forEach(function (k) { if (k < pl.de || k > pl.ate) dias[k] = velhos[k]; });
        Object.keys(pl.dias).forEach(function (k) { dias[k] = pl.dias[k]; });
        novo.lab.placar = { corte: pl.corte, geradoEm: pl.geradoEm, de: pl.de, ate: pl.ate, arquivo: previaLab.arquivo, importadoPor: cap.eu || null, dias: dias };
        novo.importacoes = (novo.importacoes || []).concat([{ em: pl.geradoEm, por: cap.eu || null, corte: pl.corte, arquivo: "[Lab] " + previaLab.arquivo.nome, hash: previaLab.arquivo.hash, linhas: pl.linhasLidas, validos: pl.coletas }]).slice(-150);
      }
      publicar(novo, pub, document.getElementById("gl-pub-status"));
    };
  }

  function quem(id) { return id ? (nomes[id] || "editor") : "—"; }
  function abaRegistro() {
    var h = '', alt = (ESTADO.alteracoes || []).slice().reverse(), imp = (ESTADO.importacoes || []).slice().reverse();
    h += '<p>Tudo o que muda o resultado fica aqui: cada placar publicado (com a impressão digital do arquivo do Naja) e cada mudança de prefixo, horas ou classe.</p>';
    h += '<h3 class="g-sub">Alterações de regra</h3>';
    if (!alt.length) h += '<p class="vazio">Nenhuma alteração registrada.</p>';
    else {
      h += '<div class="tabela-wrap"><table class="t"><thead><tr><th>Quando</th><th>Quem</th><th>Pessoa</th><th>Campo</th><th>De</th><th>Para</th><th>Motivo</th></tr></thead><tbody>';
      alt.forEach(function (a) {
        h += '<tr><td>' + quando(a.em) + (a.aposCongelar ? ' <span class="selo">após congelar</span>' : '') + '</td><td class="esq" data-uid="' + esc(a.por || "") + '">' + esc(quem(a.por)) + '</td><td class="esq">' + esc(a.nome) + '</td><td class="esq">' + esc(CAMPOS_REGRA[a.campo] || a.campo) +
          '</td><td class="esq">' + esc(a.de) + '</td><td class="esq">' + esc(a.para) + '</td><td class="esq quebra">' + esc(a.motivo || "—") + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '<h3 class="g-sub">Placares publicados</h3>';
    if (!imp.length) h += '<p class="vazio">Os próximos placares publicados aparecem aqui. Placar atual: exportação de ' + (ESTADO.placar ? dataBRano(ESTADO.placar.corte) : '—') + ', publicado antes do registro existir.</p>';
    else {
      h += '<div class="tabela-wrap"><table class="t"><thead><tr><th>Publicado em</th><th>Quem</th><th>Exportação de</th><th>Arquivo</th><th>Impressão digital</th><th>Linhas</th><th>Válidos</th></tr></thead><tbody>';
      imp.forEach(function (a) {
        h += '<tr><td>' + quando(a.em) + '</td><td class="esq" data-uid="' + esc(a.por || "") + '">' + esc(quem(a.por)) + '</td><td>' + dataBRano(a.corte) + '</td><td class="esq">' + esc(a.arquivo) + '</td><td class="esq mono">' + esc(a.hash) + '</td><td>' + num(a.linhas) + '</td><td>' + num(a.validos) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    return h;
  }
  function ligaRegistro() {
    if (!cap.user) return;
    var ids = {};
    (ESTADO.alteracoes || []).concat(ESTADO.importacoes || []).forEach(function (a) { if (a.por) ids[a.por] = 1; });
    var lista = Object.keys(ids); if (!lista.length) return;
    cap.user.profiles(lista).then(function (ps) {
      lista.forEach(function (id) { if (ps[id] && ps[id].name) nomes[id] = ps[id].name; });
      document.querySelectorAll("#gestao [data-uid]").forEach(function (td) { if (td.dataset.uid) td.textContent = quem(td.dataset.uid); });
    }).catch(function () {});
  }

  /* ---------- publicar: a página é o registro ---------- */
  var RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  function montar(estado) {
    var fim = "</" + "script>";
    var json = JSON.stringify(estado).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>Campeão de Agendamentos</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;600;700;800&display=swap">\n' +
      '<style id="css">' + document.getElementById("css").textContent + '</style>\n' +
      '<script type="application/json" id="estado">' + json + fim + '\n' +
      '<div id="app"></div>\n' +
      '<script id="calc-src">' + document.getElementById("calc-src").textContent + fim + '\n' +
      '<script id="app-src">' + document.getElementById("app-src").textContent + fim + '\n' +
      '</body></html>';
  }
  /* ---------- página do site (fora do Claude): só visualização, estado embutido ---------- */
  function hashTxt(t) { var h = 5381; for (var i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); }
  function montarSite(estado) {
    var fim = "</" + "script>";
    var e = JSON.parse(JSON.stringify(estado));
    delete e.alteracoes; delete e.importacoes; delete e.base;   /* registro interno não vai para o site público */
    if (e.placar) delete e.placar.base;
    var json = JSON.stringify(e).replace(/</g, "\\u003c");
    var versao = hashTxt(json + document.getElementById("css").textContent + document.getElementById("calc-src").textContent + document.getElementById("app-src").textContent);
    return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">' +
      '<meta name="campeao-versao" content="' + versao + '"><title>Campeão de Agendamentos</title>' +
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;600;700;800&display=swap">' +
      '<style>' + RESET.replace("color-scheme:light;", "") + '</style>\n' +
      '<style id="css">' + document.getElementById("css").textContent + '</style></head><body>\n' +
      '<script type="application/json" id="estado">' + json + fim + '\n' +
      '<div id="app"></div>\n' +
      '<script id="calc-src">' + document.getElementById("calc-src").textContent + fim + '\n' +
      '<script id="app-src">' + document.getElementById("app-src").textContent + fim + '\n' +
      '</body></html>';
  }
  function baixarSite(status) {
    if (!cap.downloads) return;
    cap.downloads.save({ filename: "index.html", data: montarSite(ESTADO) })
      .then(function () { status.textContent = "Baixado. Arraste o index.html para o site (veja o passo a passo)."; })
      .catch(function (e) { var c = e && e.code; status.textContent = c === "declined" ? "Download cancelado." : "Não foi possível baixar aqui."; });
  }

  function publicar(estado, botao, status) {
    if (!cap.artifact) return;
    botao.disabled = true; status.textContent = "Publicando…";
    cap.artifact.publish(montar(estado)).then(function () {
      status.textContent = "Publicado. A página vai recarregar.";
    }).catch(function (e) {
      var code = e && e.code;
      if (code === "conflict") status.textContent = "Alguém publicou antes. A página vai recarregar com a versão mais nova; refaça a alteração.";
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled") { status.textContent = "Esta conta só pode ver o painel, não publicar."; cap.podeEditar = false; }
      else if (code === "rate_limited") { status.textContent = "Muitas publicações seguidas. Espere um minuto e tente de novo."; botao.disabled = false; }
      else if (code === "too_large") { status.textContent = "O painel ficou grande demais. Remova algumas fotos e tente de novo."; botao.disabled = false; }
      else { status.textContent = "Não foi possível publicar (" + (e && e.message || code || "erro") + "). Tente de novo."; botao.disabled = false; }
    });
  }

  render();
  rotacionar();
  if (TV) ligarTela();
  abertura();
  setInterval(function () { if (!tela) render(); }, 60 * 60 * 1000 + 90000);

  /* fora do Claude (site da TV): confere a cada 5 min se subiu versão nova e recarrega */
  var minhaVersao = (document.querySelector('meta[name="campeao-versao"]') || {}).content;
  if (minhaVersao && !(window.claude && window.claude.use)) {
    setInterval(function () {
      if (tela || !window.fetch) return;
      fetch(location.href.split("#")[0].split("?")[0] + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
        var m = t.match(/<meta name="campeao-versao" content="([^"]+)"/);
        if (m && m[1] !== minhaVersao && !tela) location.reload();
      }).catch(function () {});
    }, 5 * 60 * 1000);
  }

  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use("user"), window.claude.use("artifact"), window.claude.use("downloads")]).then(function (r) {
      var user = r[0]; cap.artifact = r[1]; cap.user = user; cap.downloads = r[2];
      if (!user) return false;
      return Promise.all([user.canEdit(), user.id().catch(function () { return null; })]).then(function (x) { cap.eu = x[1] || null; return x[0]; });
    }).then(function (pode) {
      cap.podeEditar = !!pode && !!cap.artifact;
      if (cap.podeEditar && !TV && !tela) render();
      else if (cap.podeEditar && !TV) setTimeout(function () { if (!tela) render(); }, 4000);
    }).catch(function () {});
  }
})();
</script>
</body></html>
